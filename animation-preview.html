<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM – startanimation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #080c14; color: #f4f7ff; font-family: Arial, sans-serif; }
    main { max-width: 1440px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; }
    button { border: 2px solid #9e7aff; border-radius: 12px; background: #30275a; color: #fff; padding: 13px 24px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
    button:hover { background: #49367e; }
    button:focus-visible { outline: 3px solid #25d4b8; outline-offset: 4px; }
    .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #35445e; border-radius: 16px; background: #10131d; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 600px) { body { padding: 16px; } h1 { font-size: 18px; } button { padding: 10px 15px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Medins Mediacenter</h1>
      <button type="button" id="replay">Spela igen ↻</button>
    </header>
    <div class="screen">
      <iframe id="screen" src="index.html" title="Förhandsvisning av MM-startanimationen"></iframe>
    </div>
  </main>
  <script>
    document.getElementById("replay").addEventListener("click", function () {
      document.getElementById("screen").src = "index.html?intro=" + Date.now();
    });
  </script>
</body>
</html>
